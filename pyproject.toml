[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "byjwu-editor"
version = "0.1.0"
description = "byjwu-editor: edits byjustinwu YouTube videos to FCPXML with TypeSafe Jev, Claude Opus 5.5, and a Grok Bot room, plus the cutmcp EDL cutter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
otio = ["opentimelineio>=0.17"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
cutmcp = "cutmcp.server:main"
cut-conductor = "conductor.cli:main"

[tool.setuptools.packages.find]
include = ["cutmcp*", "conductor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
